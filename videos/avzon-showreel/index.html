<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>AVZON — Showreel</title>
    <!-- GSAP 3.14.2 is vendored from npm: the render must not depend on a CDN. -->
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #050608;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #050608;
      }
      [data-composition-id="main"] > div[data-composition-src] {
        position: absolute;
        inset: 0;
      }
      /* zoom-through pivots: the ring's bore (S2) and the tunnel's vanishing point (S3) */
      #el-s2 {
        transform-origin: 960px 560px;
      }
      #el-s3 {
        transform-origin: 960px 540px;
      }
      /* overlay stack: blend modes live on the slots so they composite against the scenes */
      #el-hud {
        z-index: 15;
      }
      #el-flash {
        z-index: 20;
        mix-blend-mode: screen;
      }
      #el-grain {
        z-index: 40;
        mix-blend-mode: soft-light;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="15"
      data-width="1920"
      data-height="1080"
    >
      <!-- scenes -->
      <div
        id="el-s1"
        data-composition-id="s1-ignition"
        data-composition-src="compositions/s1-ignition.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s2"
        data-composition-id="s2-halo"
        data-composition-src="compositions/s2-halo.html"
        data-start="2.5"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s3"
        data-composition-id="s3-velocity"
        data-composition-src="compositions/s3-velocity.html"
        data-start="5.5"
        data-duration="3"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s4"
        data-composition-id="s4-converge"
        data-composition-src="compositions/s4-converge.html"
        data-start="8.5"
        data-duration="1.5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-s5"
        data-composition-id="s5-lockup"
        data-composition-src="compositions/s5-lockup.html"
        data-start="10"
        data-duration="5"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- persistent layers (each scene carries its own vignette beneath its typography) -->
      <div
        id="el-hud"
        data-composition-id="fx-hud"
        data-composition-src="compositions/fx-hud.html"
        data-start="0"
        data-duration="10"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-flash"
        data-composition-id="fx-flash"
        data-composition-src="compositions/fx-flash.html"
        data-start="0"
        data-duration="15"
        data-track-index="4"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="el-grain"
        data-composition-id="fx-grain"
        data-composition-src="compositions/fx-grain.html"
        data-start="0"
        data-duration="15"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- sound: synthesized score + bundled SFX, mastered to -14 LUFS (tools/score.py) -->
      <audio
        id="au-score"
        src="assets/audio/score.wav"
        data-start="0"
        data-duration="15"
        data-track-index="10"
        data-volume="1"
      ></audio>
    </div>

    <script>
      (function () {
        // The root timeline only carries the one transition that must move
        // scene slots: the velocity-matched zoom through the ring's bore @5.50.
        var tl = gsap.timeline({ paused: true });
        var T2 = 5.5;
        tl.fromTo(
          "#el-s2",
          { scale: 1, filter: "blur(0px)" },
          { scale: 2.7, filter: "blur(14px)", duration: 0.36, ease: "power3.in", immediateRender: false },
          T2 - 0.36,
        );
        tl.fromTo(
          "#el-s3",
          { scale: 0.52, filter: "blur(14px)" },
          { scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out", immediateRender: false },
          T2,
        );
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
